{% extends "base.html" %}
{% block title %}Researching…{% endblock %}
{% block head %}
<style>
  .spinner { width:36px;height:36px;border:3px solid var(--border);
             border-top-color:var(--accent);border-radius:50%;
             animation:spin .8s linear infinite;margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .progress-log { font-size:13px;color:var(--muted);margin-top:10px;min-height:24px;text-align:center; }
  .error-box { background:rgba(248,113,113,0.08);border:1px solid var(--danger);
               border-radius:10px;padding:14px;color:var(--danger);font-size:13px;
               white-space:pre-wrap;margin-top:14px; }
</style>
{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:32px 18px" id="statusCard">
  <div id="spinnerEl" class="spinner"></div>
  <div style="font-size:17px;font-weight:700;margin-bottom:6px" id="headlineEl">
    Researching {{ job.service_name }} ({{ job.state }})…
  </div>
  <div class="progress-log" id="progressEl">{{ job.progress or 'Queued…' }}</div>
  <div id="errorEl" style="display:none"></div>
  <div style="margin-top:20px;font-size:12px;color:var(--muted)">
    This usually takes 1–3 minutes. Leave this tab open.
  </div>
</div>
<script>
  const jobId = "{{ job.id }}";
  let poll = setInterval(async () => {
    try {
      const d = await (await fetch('/api/status/' + jobId)).json();
      document.getElementById('progressEl').textContent = d.progress || '…';
      if (d.status === 'done') { clearInterval(poll); location.href = '/review/' + jobId; }
      if (d.status === 'error') {
        clearInterval(poll);
        document.getElementById('spinnerEl').style.display = 'none';
        document.getElementById('headlineEl').textContent = 'Research failed';
        const e = document.getElementById('errorEl');
        e.style.display = '';
        e.innerHTML = '<div class="error-box">' + (d.error||'Unknown error') + '</div>' +
          '<a href="/" class="btn" style="margin-top:14px;display:inline-flex">Try again</a>';
      }
    } catch(e) {}
  }, 2500);
</script>
{% endblock %}
